<svg width="760" height="290" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#201f1c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/></marker></defs><rect x="320.0" y="40" width="120" height="46" fill="#2d6a4f" stroke="none"/><text x="380" y="69" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="600">寄存器</text><rect x="260.0" y="90" width="240" height="46" fill="#3a7d5f" stroke="none"/><text x="380" y="119" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="600">Cache（SRAM）</text><rect x="200.0" y="140" width="360" height="46" fill="#6a9c85" stroke="none"/><text x="380" y="169" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="600">主存（DRAM）</text><rect x="140.0" y="190" width="480" height="46" fill="#b7cfc2" stroke="none"/><text x="380" y="219" text-anchor="middle" font-size="14.5" fill="#201f1c" font-weight="600">外存（磁盘/SSD）</text><text x="640" y="70" font-size="13" fill="#2d6a4f" font-weight="600">↑ 更快 更贵 更小</text><text x="640" y="250" font-size="13" fill="#b45309" font-weight="600">↓ 更慢 更便宜 更大</text><text x="380" y="262" text-anchor="middle" font-size="13" fill="#64615a">层次依据：局部性原理（时间局部性 + 空间局部性）</text></svg>