<svg width="760" height="415" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#201f1c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f"/></marker></defs><rect x="80" y="80" width="120" height="50" rx="10" fill="#fff" stroke="#201f1c" stroke-width="1.6"/><text x="140.0" y="110.4" text-anchor="middle" font-size="15" fill="#201f1c" font-weight="600">客户端</text><rect x="560" y="80" width="120" height="50" rx="10" fill="#fff" stroke="#201f1c" stroke-width="1.6"/><text x="620.0" y="110.4" text-anchor="middle" font-size="15" fill="#201f1c" font-weight="600">服务器</text><line x1="200" y1="200" x2="560" y2="200" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#ar)"/><text x="380.0" y="192.0" text-anchor="middle" font-size="12.5" fill="#64615a">SYN（seq=x）</text><line x1="560" y1="260" x2="200" y2="260" stroke="#201f1c" stroke-width="1.8" marker-end="url(#ar)"/><text x="380.0" y="252.0" text-anchor="middle" font-size="12.5" fill="#64615a">SYN+ACK（seq=y, ack=x+1）</text><line x1="200" y1="320" x2="560" y2="320" stroke="#2d6a4f" stroke-width="1.8" marker-end="url(#ar)"/><text x="380.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#64615a">ACK（ack=y+1）</text><line x1="140" y1="130" x2="140" y2="360" stroke="#e6e2d8" stroke-width="1.4"/><line x1="620" y1="130" x2="620" y2="360" stroke="#e6e2d8" stroke-width="1.4"/><text x="380" y="395" text-anchor="middle" font-size="13" fill="#64615a">目的：确认双方收发能力，同步初始序号 —— 只有"真→假"才失败的连接建立</text></svg>